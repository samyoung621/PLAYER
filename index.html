<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>福爾摩鯊打擊成績</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: scoreboard header → league leaders strip → roster cards → full stat sheet (sortable) */
:root{
  --bg:#eff3f4; --surface:#ffffff; --ink:#132230; --muted:#56656f; --line:#d3dde1;
  --field:#1d5a73; --clay:#167d7f; --chalk:#f7f5f0; --board:#0f2a44; --board-ink:#e6eef2; --gold:#5ec4c6;
  --display:"Barlow Condensed","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161d; --surface:#16222b; --ink:#e4ecef; --muted:#93a4ae; --line:#26353f;
  --field:#3f8fae; --clay:#4fc2c4; --chalk:#1a2127; --board:#08182a; --board-ink:#e6eef2; --gold:#6fd3d5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161d; --surface:#16222b; --ink:#e4ecef; --muted:#93a4ae; --line:#26353f;
  --field:#3f8fae; --clay:#4fc2c4; --chalk:#1a2127; --board:#08182a; --board-ink:#e6eef2; --gold:#6fd3d5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 56px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* scoreboard header */
.brand{display:flex;align-items:center;gap:16px}
.logo{height:64px;width:auto;max-width:40vw;object-fit:contain;border-radius:6px}
.board{background:var(--board);color:var(--board-ink);padding-block:28px 22px}
.board .wrap{padding-block:0;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between}
.board h1{margin:0;font-weight:900;font-size:clamp(28px,5vw,44px);letter-spacing:.02em;line-height:1.15;text-wrap:balance}
.board .eyebrow{font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:14px;font-weight:600}
.totals{display:flex;flex-wrap:wrap;gap:4px}
.totals div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:6px 12px;min-width:68px;text-align:center}
.totals b{display:block;font-family:var(--display);font-size:28px;font-weight:700;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.totals span{font-size:12px;color:#b9b3a3;letter-spacing:.08em}
.status{font-size:13px;color:var(--muted);margin:14px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:#3fae6b}.dot.snap{background:var(--gold)}

h2{font-size:20px;margin:40px 0 14px;font-weight:900;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--display);font-weight:600;color:var(--clay);letter-spacing:.14em;font-size:13px;text-transform:uppercase}

/* leaders */
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.leader{background:var(--surface);border:1px solid var(--line);padding:14px 16px}
.leader h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.leader ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.leader li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline}
.leader li:first-child .v{color:var(--clay);font-size:26px}
.leader .v{font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.leader .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leader .n i{font-style:normal;color:var(--muted);font-family:var(--display);margin-right:6px}
.empty{color:var(--muted);font-size:13px}

/* roster */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:7px 10px;border-radius:4px}
.toolbar input{flex:1;min-width:0;max-width:280px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--clay)}
.card:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.photo{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--field);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:64px;font-weight:700;color:rgba(255,255,255,.85)}
.photo .jersey{position:absolute;left:0;bottom:0;background:#0f2a44;color:#fff;font-family:var(--display);font-weight:700;font-size:22px;line-height:1;padding:6px 10px 5px}
.card .meta{padding:10px 12px 12px;display:grid;gap:6px}
.card .name{font-weight:700;font-size:16px}
.slash{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;font-size:11px;color:var(--muted)}
.slash b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12.5px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface)}
th:hover{color:var(--ink)}
th.on{color:var(--clay)}
th.on::after{content:attr(data-dir);margin-left:3px}
td{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
td.l,th.l{text-align:left}
td.pname{font-family:var(--body);font-size:14px;font-weight:500}
tbody tr:hover{background:color-mix(in srgb,var(--clay) 7%,transparent)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.rate{color:var(--field)}

.note{font-size:13px;color:var(--muted);margin-top:12px;max-width:68ch}

/* detail */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.55);display:grid;place-items:center;padding:16px;z-index:10}
.panel{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:90vh;overflow:auto;display:grid;grid-template-columns:170px 1fr}
.panel .photo{aspect-ratio:auto;min-height:220px}
.panel .info{padding:18px 20px;min-width:0}
.panel h3{margin:0;font-size:24px;font-weight:900}
.panel .close{float:right;background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;margin-top:14px}
.grid div{border-top:1px solid var(--line);padding-top:4px}
.grid span{font-size:12px;color:var(--muted);display:block}
.grid b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:520px){.panel{grid-template-columns:1fr}.panel .photo{min-height:200px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="brand">
      <img id="logo" class="logo" alt="福爾摩鯊隊徽" hidden>
      <div>
      <div class="eyebrow">Formosharks · Batting Records 2026</div>

<main class="wrap">

    <select id="sortRoster" aria-label="名單排序">
      <option value="order">依表單順序</option>
      <option value="num">依背號</option>
      <option value="avg">依打擊率</option>
      <option value="h">依安打數</option>
      <option value="rbi">依打點</option>
    </select>
  </div>
  <div class="roster" id="roster"></div>

  <h2>完整打擊數據 <small>Stat Sheet</small></h2>
  <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
  <p class="note">打擊率＝安打 ÷ 打數；上壘率＝(安打＋四壞球) ÷ (打數＋四壞球)；長打率＝壘打數 ÷ 打數。失誤上壘不計入上壘率。打擊排行門檻為打席數達球隊最多者的一半以上。點欄位標題可排序。</p>
</main>

<div class="overlay" id="overlay" hidden></div>

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=""}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const n=v=>{const x=parseFloat(String(v??"").replace(/,/g,""));return isFinite(x)?x:0};
const fmt3=v=>v==null?"—":(v>=1?v.toFixed(3):v.toFixed(3).replace(/^0/,""));

function toPlayers(rows){
  const head=rows[0].map(h=>h.trim()), idx=k=>head.indexOf(k);
  const get=(r,k)=>idx(k)>=0?(r[idx(k)]??"").trim():"";
  return rows.slice(1).filter(r=>(r[0]||"").trim().toLowerCase()!=="total"&&get(r,"姓名")).map((r,i)=>{
    const p={order:i,num:get(r,"背號"),photo:get(r,"照片"),name:get(r,"姓名"),
      pa:n(get(r,"打席")),ab:n(get(r,"打數")),rbi:n(get(r,"打點")),
      s:n(get(r,"一壘安打")),d:n(get(r,"二壘安打")),t:n(get(r,"三壘安打")),hr:n(get(r,"全壘打")),
      roe:n(get(r,"失誤上壘")),so:n(get(r,"三振")),bb:n(get(r,"四壞球"))};
    const hRaw=get(r,"安打數"); p.h=hRaw!==""?n(hRaw):p.s+p.d+p.t+p.hr;
    return calc(p);
  });
}
function calc(p){
  p.tb=p.s+2*p.d+3*p.t+4*p.hr;
  p.avg=p.ab?p.h/p.ab:null;
  p.obp=(p.ab+p.bb)?(p.h+p.bb)/(p.ab+p.bb):null;
  p.slg=p.ab?p.tb/p.ab:null;
  p.ops=(p.obp!=null&&p.slg!=null)?p.obp+p.slg:null;
  return p;
}

let PLAYERS=[];
const el=id=>document.getElementById(id);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else e.setAttribute(k,v)}kids.flat().forEach(k=>k!=null&&e.append(k));return e}

function photoEl(p){
  const box=h("div",{class:"photo"});
  const ph=h("div",{class:"ph",text:p.name.slice(0,1)});box.append(ph);
  if(p.photo){const img=h("img",{alt:p.name,loading:"lazy",referrerpolicy:"no-referrer"});
    img.onerror=()=>img.remove();img.src=p.photo;box.append(img)}
  box.append(h("div",{class:"jersey",text:"#"+(p.num||"—")}));
  return box;
}

function renderTotals(){
  const T=calc(PLAYERS.reduce((a,p)=>{for(const k of["pa","ab","h","rbi","s","d","t","hr","roe","so","bb"])a[k]+=p[k];return a},
    {pa:0,ab:0,h:0,rbi:0,s:0,d:0,t:0,hr:0,roe:0,so:0,bb:0}));
  el("totals").replaceChildren(...[["球員",PLAYERS.length],["打席",T.pa],["安打",T.h],["全壘打",T.hr],["打擊率",fmt3(T.avg)]]
    .map(([k,v])=>h("div",{},h("b",{text:v}),h("span",{text:k}))));
  return T;
}

function renderLeaders(){
  const maxPA=Math.max(0,...PLAYERS.map(p=>p.pa)), qual=PLAYERS.filter(p=>p.pa>0&&p.pa>=maxPA/2);
  const boards=[["打擊率","avg",qual,fmt3],["上壘率","obp",qual,fmt3],["安打","h",PLAYERS,v=>v],["打點","rbi",PLAYERS,v=>v],["全壘打","hr",PLAYERS,v=>v],["長打率","slg",qual,fmt3]];
  el("leaders").replaceChildren(...boards.map(([title,key,pool,f])=>{
    const top=pool.filter(p=>p[key]!=null&&p[key]>0).sort((a,b)=>b[key]-a[key]).slice(0,3);
    return h("div",{class:"leader"},h("h3",{text:title}),
      top.length?h("ol",{},top.map(p=>h("li",{},h("span",{class:"n"},h("i",{text:"#"+p.num}),p.name),h("span",{class:"v",text:f(p[key])}))))
               :h("p",{class:"empty",text:"尚無比賽紀錄"}));
  }));
}

function renderRoster(){
  const q=el("q").value.trim().toLowerCase(), s=el("sortRoster").value;
  let list=PLAYERS.filter(p=>!q||p.name.toLowerCase().includes(q)||p.num===q);
  const by={order:(a,b)=>a.order-b.order,num:(a,b)=>n(a.num)-n(b.num),
    avg:(a,b)=>(b.avg??-1)-(a.avg??-1),h:(a,b)=>b.h-a.h,rbi:(a,b)=>b.rbi-a.rbi};
  list.sort(by[s]);
  el("roster").replaceChildren(...list.map(p=>{
    const b=h("button",{class:"card",type:"button","aria-label":`${p.name} #${p.num} 詳細數據`},photoEl(p),
      h("div",{class:"meta"},h("div",{class:"name",text:p.name}),
        h("div",{class:"slash"},...[["打擊率",p.avg],["上壘率",p.obp],["長打率",p.slg]].map(([k,v])=>h("div",{},h("b",{text:fmt3(v)}),k)))));
    b.onclick=()=>openDetail(p);return b;
  }));
  if(!list.length)el("roster").append(h("p",{class:"empty",text:"找不到符合的球員"}));
}

const COLS=[["num","背號","l"],["name","姓名","l"],["pa","打席"],["ab","打數"],["h","安打"],["s","一安"],["d","二安"],["t","三安"],["hr","全壘打"],["rbi","打點"],["bb","四壞"],["so","三振"],["roe","失誤上壘"],["avg","打擊率",,1],["obp","上壘率",,1],["slg","長打率",,1],["ops","OPS",,1]];
let sortKey="order",sortDir=-1;
function cell(p,[k,,cls,rate]){
  const v=p[k];const td=h("td",{class:[cls,rate&&"rate",k==="name"&&"pname"].filter(Boolean).join(" ")});
  td.textContent=rate?fmt3(v):(k==="num"?"#"+v:v);return td;
}
function renderTable(T){
  const t=el("tbl");
  t.tHead.replaceChildren(h("tr",{},COLS.map(c=>{const th=h("th",{class:(c[2]||"")+(sortKey===c[0]?" on":""),"data-dir":sortDir>0?"▲":"▼",scope:"col",tabindex:"0",text:c[1]});
    const go=()=>{if(sortKey===c[0])sortDir*=-1;else{sortKey=c[0];sortDir=c[2]?1:-1}renderTable(T)};
    th.onclick=go;th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};return th})));
  const rows=[...PLAYERS].sort((a,b)=>{if(sortKey==="order")return a.order-b.order;
    let x=a[sortKey],y=b[sortKey];if(sortKey==="num"){x=n(x);y=n(y)}
    if(x==null)return 1;if(y==null)return -1;
    return (typeof x==="string"?x.localeCompare(y,"zh-Hant"):x-y)*sortDir});
  t.tBodies[0].replaceChildren(...rows.map(p=>{const tr=h("tr",{},COLS.map(c=>cell(p,c)));tr.style.cursor="pointer";tr.onclick=()=>openDetail(p);return tr}));
  t.tFoot.replaceChildren(h("tr",{},COLS.map((c,i)=>i===0?h("td",{class:"l pname",text:"全隊"}):i===1?h("td",{}):cell(T,c))));
}

function openDetail(p){
  const o=el("overlay");
  const close=h("button",{class:"close",type:"button","aria-label":"關閉",text:"×"});
  const stats=[["打席",p.pa],["打數",p.ab],["安打",p.h],["一壘安打",p.s],["二壘安打",p.d],["三壘安打",p.t],["全壘打",p.hr],["打點",p.rbi],["壘打數",p.tb],["四壞球",p.bb],["三振",p.so],["失誤上壘",p.roe],["打擊率",fmt3(p.avg)],["上壘率",fmt3(p.obp)],["長打率",fmt3(p.slg)]];
  o.replaceChildren(h("div",{class:"panel",role:"dialog","aria-modal":"true","aria-label":p.name},photoEl(p),
    h("div",{class:"info"},close,h("h3",{text:p.name}),h("div",{class:"num",style:"color:var(--muted)",text:"#"+p.num}),
      h("div",{class:"grid"},stats.map(([k,v])=>h("div",{},h("span",{text:k}),h("b",{text:v})))))));
  o.hidden=false;close.focus();
  const shut=()=>{o.hidden=true;document.removeEventListener("keydown",esc)};
  const esc=e=>{if(e.key==="Escape")shut()};
  close.onclick=shut;o.onclick=e=>{if(e.target===o)shut()};document.addEventListener("keydown",esc);
}

function renderAll(){const T=renderTotals();renderLeaders();renderRoster();renderTable(T)}
el("q").oninput=renderRoster;el("sortRoster").onchange=renderRoster;

function setStatus(kind,text){el("status").replaceChildren(h("span",{class:"dot "+kind}),text)}

(async()=>{
  PLAYERS=toPlayers(parseCSV(SNAPSHOT));renderAll();
  setStatus("snap","顯示 2026/10/7 的資料快照，正在連線試算表…");
  try{
    const r=await fetch(CSV_URL+"&t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const rows=parseCSV(await r.text());
    if(rows.length<2||!rows[0].includes("姓名"))throw new Error("format");
    PLAYERS=toPlayers(rows);renderAll();
    setStatus("live","已同步試算表最新資料 · "+new Date().toLocaleString("zh-TW",{hour12:false}));
  }catch(e){
    setStatus("snap","目前顯示 2026/10/7 的資料快照（此頁面無法連線試算表，網站上線後會自動讀取最新成績）");
  }
})();
</script>
